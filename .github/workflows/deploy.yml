#
# This is a working example of using GitHub Actions to publish the docs
# to the GitHub Pages (gh_pages) branch.
#
# Remember to have a requirements.txt file with the required dependencies.
# This template ships with one by default.
#
# It is also recommendet to also copy the template with all branches, to
# have the gh-pages branch pre-made. This prevents possible errors.
#
name: Deploy Site

on:
  # Manual trigger. Needed because a run that fails at startup (e.g. the Actions
  # policy rejecting an action) cannot be re-run, and the push trigger below only
  # fires on content paths — leaving no way to redeploy without a content change.
  workflow_dispatch:
  pull_request:
  push:
    paths: 
    - 'docs/**'
    - 'mkdocs.yml'
    - 'theme/**'
    branches:
    - main
permissions: 
  pages: write
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.x
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install -r requirements.txt
    - name: Deploy Files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        mkdocs gh-deploy --force
